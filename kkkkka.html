<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do list</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black flex items-center justify-center min-h-screen">

    <div class="bg-gray-500 border border-gray-600 rounded-lg shadow w-full p-4 max-w-md">
<h1 class="text-white font-bold text-center text-xl p-4">借金返済のためのすることリスト</h1>

<div class="flex gap-2 mb-4">
  <input id="todoInput" type="text" placeholder="やることを決めてね💕"
    class="flex-1 border border-gray-300 rounded px-3 py-2">
<button id="addBtn" 
    class="bg-red-500 text-white font-bold rounded hover:bg-red-700 transition px-3 py-2">
追加
    </button>
</div>

<ul id="todoList" class="space-y-2"></ul>
</div>



<script>
    const addButton = document.querySelector("#addBtn");
    const todoInput = document.querySelector("#todoInput");
    const todoList = document.querySelector("#todoList");

    addButton.addEventListener("click", () => {
        const text = todoInput.value;

        if (text === "") {
        return;
        }

        const item = document.createElement("li");
        item.className = "flex items-center justify-between bg-gray-50 rounded px-3 py-2";

        const span = document.createElement("span");
        span.textContent = text;

        const doneBtn = document.createElement("button");
        doneBtn.textContent = "完了";
        doneBtn.className = "text-sm text-gray-500 hover:text-red-500";

        doneBtn.addEventListener("click", () => {
        span.classList.toggle("line-through");
        span.classList.toggle("text-gray-400");
        });

        item.appendChild(span);
        item.appendChild(doneBtn);
        todoList.appendChild(item);

        todoInput.value = "";
    });
    </script>

</body>
</html>
